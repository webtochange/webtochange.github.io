<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Creator</title>
    <link rel="shortcut icon" href="../../assets/images/favicon/favicon.png" type="image/x-icon">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap');

        * {
            font-family: 'Silkscreen', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .character-creator-container {
            display: flex;
            flex-direction: row;
            background-color: #333;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            width: 90%;
            max-width: 1200px;
        }

        .character-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #222;
            padding: 20px;
            min-height: 400px;
            font-size: 24px;
        }

        .customization-panel {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h2 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #f0f0f0;
            text-align: center;
        }

        .tabs {
            display: flex;
            margin-bottom: 15px;
        }

        .tab-button {
            background-color: #555;
            color: #fff;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
            flex-grow: 1;
            text-align: center;
            transition: background-color 0.2s ease;
        }

        .tab-button:hover {
            background-color: #777;
        }

        .tab-button.active {
            background-color: #f0f0f0;
            color: #111;
        }

        .tab-content {
            display: none;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: #444;
            max-height: 400px;
            overflow-y: auto;
        }

        .tab-content.active {
            display: flex;
        }

        .item-display {
            background-color: #666;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .item-display:hover {
            background-color: #888;
        }

        .item-display.selected {
            border: 2px solid #f0f0f0;
        }

        .btn {
            background-color: #f0f0f0;
            color: #111;
            padding: 10px 30px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s ease;
            width: fit-content;
            margin: 0 auto;
        }

        .btn:hover {
            transform: scale(1.1);
            background-color: #cecece;
        }
    </style>
</head>
<body>
    <div class="character-creator-container">
        <div class="character-display" id="character-display"></div>
        <div class="customization-panel">
            <h2>Customize Your Character</h2>
            <div class="tabs">
                <button class="tab-button active" data-category="hat_hair">Hat/Hair</button>
                <button class="tab-button" data-category="face">Face</button>
                <button class="tab-button" data-category="top">Top</button>
                <button class="tab-button" data-category="bottom">Bottom</button>
            </div>

            <div id="hat_hair_content" class="tab-content active"></div>
            <div id="face_content" class="tab-content"></div>
            <div id="top_content" class="tab-content"></div>
            <div id="bottom_content" class="tab-content"></div>

            <button class="btn" id="saveCharacter">Save Character</button>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const characterDisplay = document.getElementById("character-display");
            const tabButtons = document.querySelectorAll(".tab-button");
            const tabContents = document.querySelectorAll(".tab-content");
            const saveCharacterBtn = document.getElementById("saveCharacter");

            const categoryCounts = {
                hat_hair: 2,
                face: 5,
                top: 10,
                bottom: 150
            };

            const characterData = {};

            Object.entries(categoryCounts).forEach(([category, count]) => {
                characterData[category] = [];
                for (let i = 1; i <= count; i++) {
                    characterData[category].push({ id: i });
                }
            });

            let selectedItems = {
                hat_hair: characterData.hat_hair[0].id,
                face: characterData.face[0].id,
                top: characterData.top[0].id,
                bottom: characterData.bottom[0].id
            };

            function populateTabContent(category) {
                const contentDiv = document.getElementById(`${category}_content`);
                contentDiv.innerHTML = "";
                characterData[category].forEach(item => {
                    const itemDiv = document.createElement("div");
                    itemDiv.classList.add("item-display");
                    itemDiv.textContent = `ID: ${item.id}`;
                    itemDiv.dataset.id = item.id;
                    itemDiv.dataset.category = category;
                    if (item.id === selectedItems[category]) {
                        itemDiv.classList.add("selected");
                    }
                    itemDiv.addEventListener("click", () => {
                        const currentSelected = contentDiv.querySelector(".item-display.selected");
                        if (currentSelected) {
                            currentSelected.classList.remove("selected");
                        }
                        itemDiv.classList.add("selected");
                        selectedItems[category] = item.id;
                        updateCharacterDisplay();
                    });
                    contentDiv.appendChild(itemDiv);
                });
            }

            function switchTab(selectedCategory) {
                tabButtons.forEach(button => {
                    if (button.dataset.category === selectedCategory) {
                        button.classList.add("active");
                    } else {
                        button.classList.remove("active");
                    }
                });

                tabContents.forEach(content => {
                    if (content.id === `${selectedCategory}_content`) {
                        content.classList.add("active");
                    } else {
                        content.classList.remove("active");
                    }
                });
                populateTabContent(selectedCategory);
            }

            tabButtons.forEach(button => {
                button.addEventListener("click", () => {
                    switchTab(button.dataset.category);
                });
            });

            function updateCharacterDisplay() {
                characterDisplay.innerHTML = `
                    <p>Hat/Hair ID: ${selectedItems.hat_hair}</p>
                    <p>Face ID: ${selectedItems.face}</p>
                    <p>Top ID: ${selectedItems.top}</p>
                    <p>Bottom ID: ${selectedItems.bottom}</p>
                `;
            }

            saveCharacterBtn.addEventListener("click", () => {
                alert("Character saved: " + JSON.stringify(selectedItems));
            });

            switchTab("hat_hair");
            updateCharacterDisplay();
        });
    </script>
</body>
</html>
